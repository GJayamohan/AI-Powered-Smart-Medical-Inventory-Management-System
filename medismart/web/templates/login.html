<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MediSmart AI Medical Inventory System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 440px;
      padding: 36px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="display: inline-flex; width: 50px; height: 50px; background: linear-gradient(135deg, #14b8a6, #0284c7); border-radius: 12px; align-items: center; justify-content: center; font-size: 26px; color: #fff; font-weight: bold; margin-bottom: 12px;">
        ⚕
      </div>
      <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px;">MediSmart</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
        AI-Powered Medical Inventory & Diagnosis System
      </p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" id="login-username" class="form-control" required placeholder="admin" value="admin">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" required placeholder="••••••••" value="admin123">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px; margin-top: 8px;">
        Sign In to Portal
      </button>
    </form>

    <!-- Quick 1-Click Demo Login Switcher -->
    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align: center;">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;">
        Demo 1-Click Role Login
      </div>
      <div style="display: flex; gap: 8px; justify-content: center;">
        <button class="btn btn-outline btn-sm" onclick="setCredentials('admin', 'admin123')">Admin</button>
        <button class="btn btn-outline btn-sm" onclick="setCredentials('pharmacist', 'pharma123')">Pharmacist</button>
        <button class="btn btn-outline btn-sm" onclick="setCredentials('cashier', 'cash123')">Cashier</button>
      </div>
    </div>

    <div style="text-align: center; margin-top: 24px; font-size: 11px; color: var(--text-muted);">
      Free & Open Source Pharmacy System
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    function setCredentials(u, p) {
      document.getElementById("login-username").value = u;
      document.getElementById("login-password").value = p;
      showToast(`Credentials filled for role: ${u.toUpperCase()}`, "info");
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("login-username").value.trim();
      const p = document.getElementById("login-password").value.trim();

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p }),
        });
        const data = await res.json();

        if (data.success) {
          showToast(data.message || "Login successful!", "success");
          setTimeout(() => {
            window.location.href = "{{ url_for('web_bp.dashboard') }}";
          }, 600);
        } else {
          showToast(data.error || "Authentication failed", "danger");
        }
      } catch (err) {
        showToast("Server communication error", "danger");
      }
    }
  </script>
</body>
</html>
